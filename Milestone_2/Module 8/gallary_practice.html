<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallary with grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 150px);
            gap: 5px;
        }
        img{
            width: 100%;
            height: 100%;
        }
        .big-img{
            grid-row: span 2;
            grid-column: span 6;
        }
        .nml-img{
            grid-row: span 2;
            grid-column: span 2;
        }
        .wide-img{
            grid-column: span 2;
            grid-row: span 1;
        }
        @media screen and (max-width: 576px){
            .container{
                grid-template-columns: repeat(2, 1fr);
            }
            .nml-img,
            .big-img,
            .wide-img,
            .img {
                grid-row: span 1;
                grid-column:span 1;
            }
        }
        @media screen and (max-width: 410px){
             .container{
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="big-img">
            <img src="/responsive-layout-example/images/A.jpg" alt="">
        </div>
        <div class="nml-img">
            <img src="/responsive-layout-example/images/B.jpg" alt="">
        </div>
        <div class="nml-img">
            <img src="/responsive-layout-example/images/C.jpg" alt="">
        </div>
        <div class="wide-img">
            <img src="/responsive-layout-example/images/D.jpg" alt="">
        </div>
        <div class="wide-img">
            <img src="/responsive-layout-example/images/E.jpg" alt="">
        </div>
        <div class="nml-img">
            <img src="/responsive-layout-example/images/F.jpg" alt="">
        </div>
        <div class="img">
            <img src="/responsive-layout-example/images/G.jpg" alt="">
        </div>
        <div class="img">
            <img src="/responsive-layout-example/images/G.jpg" alt="">
        </div>
        <div class="nml-img">
            <img src="/responsive-layout-example/images/I.jpg" alt="">
        </div>
        <div class="img">
            <img src="/responsive-layout-example/images/G.jpg" alt="">
        </div>
        <div class="img">
            <img src="/responsive-layout-example/images/G.jpg" alt="">
        </div>
    </div>
</body>
</html>
