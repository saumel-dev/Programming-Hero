<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positions</title>
    <style>
        .swim-container{
            position: relative;
            border: 2px solid peru;
        }
        .box{
            border: 2px dotted blue;
            width: 200px;
        }
        /* .ring{
            position: relative;
            left: 50px;
            top: 30px;
        } */
        /* .ring{
            position: absolute;
            bottom: 40px;
            left: 100px;
        } */
        .dummy{
            border: 1px solid turquoise;
            width: 250px;
            height: 250px;
        }
        .another{
            border: 1px solid turquoise;
            width: 250px;
            height: 250px;
        }
        /* .ring{
            position: sticky;
            top: 0px;
        } */
        .ring{
            position: fixed;
            top: 200px;
            left: 50px;
        }
    </style>
</head>
<body>
    <h3>CSS Positions</h3>
    <ol>
        <!-- Flow related -->
        <li>Static</li>
        <li>Relative</li> 
        <li>Absolute</li>
        <!-- Scroll related -->
        <li>Fixed</li>
        <li>Sticky</li>
    </ol>

    <div class="swim-container">
        <div class="boy">
            <div class="boy box"><img src="/pseudo-position-main/pseudo-position-main/swim/boy.svg" alt=""></box>
        </div>
        <div class="ring box">
            <box class="ring"><img src="/pseudo-position-main/pseudo-position-main/swim/ring.svg" alt=""></box>
        </div>
        <div class="water box">
            <box class="water"><img src="/pseudo-position-main/pseudo-position-main/swim/water.svg" alt=""></box>
        </div>

        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
    </div>
    <div class="another">
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
        <div class="dummy"></div>
    </div>
</body>
</html>
