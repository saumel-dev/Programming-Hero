<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Handler</title>
</head>

<body>
    <h1 id="page-title">Event Handler</h1>
    <button id="btn-update-title">Update title</button>
    <br>
    <h1 id="sec-h1">Amar text ta change koro</h1>
    <button id="btn-h1">Paltao</button>
    <br>
    <p id="user">No user</p>
    <button id="btn-login">Log in</button>
    <br>
    <br>
    <br>
    <!-- handle input text -->
    <p id="name">No Name</p>
    <input id="input-name" type="'text'" placeholder="Your Name">
    <button id="btn-update">Update</button>

    <script>
        // 1: set event listener
        document.getElementById('btn-update')
            .addEventListener('click', function () {
                // 2: get the text from the input field
                const nameInput = document.getElementById('input-name');
                const name = nameInput.value;
                // 3: set the name
                const nameP = document.getElementById('name');
                nameP.innerText = name;
            })
    </script>
    <script src="handler.js"></script>
</body>

</html>
