<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">
    <!-- tailwind + daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-32">
        <img src="/assets/Logo-full.png" alt="">
    </div>

    <div class="form pt-10">
        <div class="card bg-base-100 mx-auto w-full max-w-sm shrink-0 shadow rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-[14px] font-bold text-neutral">Mobile Number</label>
                    <input id="input-number" maxlength="11" minlength="11" type="text" class="border-none input bg-base-200 rounded-full"
                        placeholder="Enter your number" />
                    <br>
                    <label class="label text-[14px] font-bold text-neutral">4 Digit Pin</label>
                    <input id="input-pin" maxlength="4" minlength="4" type="password"
                        class="border-none input bg-base-200 rounded-full" placeholder="Enter 4 Digit Pin" />
                    <button id="btn-login" class="btn btn-primary rounded-full mt-4">Login</button>
                </fieldset>
            </div>
        </div>
    </div>
    </div>

    <script src="/script/login.js"></script>
</body>

</html>
